name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build EXE
        run: pyinstaller --noconfirm --clean KonwerterMP3.spec
      - name: Smoke-check the EXE
        run: |
          if (-not (Test-Path "dist/KonwerterMP3.exe")) { throw "Brak pliku dist/KonwerterMP3.exe" }
          Get-Item dist/KonwerterMP3.exe | Format-List Name,Length,LastWriteTime
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KonwerterMP3
          path: dist/KonwerterMP3.exe
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KonwerterMP3.exe
          fail_on_unmatched_files: true
